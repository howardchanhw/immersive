<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Immersive</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; font-family: Georgia, "Times New Roman", serif; background: #0b1942; color: #f4efe6; display: grid; place-items: center; }
    main { width: min(36rem, calc(100% - 2.5rem)); }
    h1 { font-size: 1.75rem; letter-spacing: 0.04em; margin: 0 0 0.4rem; }
    p { margin: 0 0 1.25rem; color: #c9d0e3; }
    a { color: inherit; text-decoration: none; display: block; padding: 0.9rem 0; border-top: 1px solid rgba(244, 239, 230, 0.18); }
    a:hover { color: #ffe8a3; }
  </style>
</head>
<body>
  <main>
    <h1>Immersive</h1>
    <p>Personal projects.</p>
    <a href="starry-night/">Starry Night</a>
  </main>
</body>
</html>
